[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-saga-of-heroes-asset-extractor"
version = "0.1.0"
description = "Command-line asset extraction tools for Vanguard: Saga of Heroes client data."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "construct>=2.10",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
]

[project.scripts]
vanguard-assets = "vanguard_assets.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["config", "extract_all_assets", "vanguard"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vanguard_assets*", "scripts*", "ue2*", "client_tables*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
client_tables = ["*.json"]
